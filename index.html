<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="description" content="DrAppIcon — Generate your app icon easily. Create iOS and Android app icons in all sizes from a single image, free and fully in your browser." />
    <meta property="og:title" content="DrAppIcon - Create Mobile App Icons" />
    <meta property="og:description" content="Generate your app icon easily. iOS + Adaptive Android icons, in your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>DrAppIcon - Create Mobile App Icons</title>
    <script>
      try {
        var t = localStorage.getItem('drappicon-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
